<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prozesssteckbrief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2432;
    --ink-soft:#5B6472;
    --paper:#FFFFFF;
    --bg:#EEF1EF;
    --line:#D8DCD8;
    --line-soft:#E4E7E3;
    --accent:#0F766E;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      linear-gradient(90deg, rgba(27,36,50,0.04) 1px, transparent 1px),
      linear-gradient(0deg, rgba(27,36,50,0.04) 1px, transparent 1px),
      var(--bg);
    background-size:36px 36px;
    min-height:100vh;
    padding:32px 24px 80px;
  }

  .shell{max-width:1100px; margin:0 auto;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .tbtn{
    font-family:'Inter',sans-serif;
    font-size:0.8rem;
    font-weight:600;
    padding:9px 14px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background .15s, transform .1s, border-color .15s;
  }
  .tbtn:hover{background:#F4F5F3; border-color:#BFC6C0;}
  .tbtn:active{transform:translateY(1px);}
  .tbtn.danger:hover{background:#FBEAE8; border-color:#E3AFA8; color:#9A3B2E;}

  .view-toggle{
    position:fixed;
    top:18px; right:18px;
    z-index:50;
    font-family:'Inter',sans-serif;
    font-size:0.78rem;
    font-weight:600;
    padding:9px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
    box-shadow:0 4px 14px -6px rgba(27,36,50,0.28);
    transition:background .15s, transform .1s;
  }
  .view-toggle:hover{background:#F4F5F3;}
  .view-toggle:active{transform:translateY(1px);}
  body.clean-view .view-toggle{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* ---------- Capture target ---------- */
  #capture-target{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 1px 2px rgba(27,36,50,0.04), 0 12px 32px -18px rgba(27,36,50,0.18);
    overflow:hidden;
  }

  .header{
    padding:26px 30px 22px;
    border-bottom:7px solid var(--bg);
  }
  .title-row{display:flex; align-items:center; gap:14px;}
  .badge-icon{flex-shrink:0;}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:1.5rem;
    color:var(--ink-soft);
    margin:0 0 4px;
    letter-spacing:0.02em;
  }
  #processName{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:1.9rem;
    letter-spacing:-0.01em;
    outline:none;
    line-height:1.2;
  }
  #processName:empty:before{content:attr(data-placeholder); color:#9AA1A9;}
  #processName:focus{border-bottom:1px dashed var(--ink-soft);}

  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    margin-top:18px;
  }
  .meta-field{min-width:140px;}
  .meta-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.64rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:3px;
  }
  .meta-value{
    font-weight:600;
    font-size:0.92rem;
    outline:none;
  }
  .meta-value:empty:before{content:attr(data-placeholder); color:#A7ADB3; font-weight:400;}
  .meta-value:focus{border-bottom:1px dashed var(--ink-soft);}

  /* ---------- Grid of cards ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--bg);
  }
  .card{
    background:var(--paper);
    padding:20px 26px 22px;
    position:relative;
  }
  .card.full{grid-column:1 / -1;}

  .card-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .card-eyebrow-wrap{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
  }
  .card-eyebrow-wrap .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0;}
  .card-eyebrow-text{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.66rem;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:500;
    outline:none;
  }
  .card-eyebrow-text:empty:before{content:attr(data-placeholder); color:color-mix(in srgb, var(--accent) 45%, white);}
  .card-eyebrow-text:focus{border-bottom:1px dashed var(--accent);}

  .card-controls{
    display:flex;
    gap:4px;
    flex-shrink:0;
    opacity:0.4;
    transition:opacity .15s;
  }
  .card:hover .card-controls{opacity:1;}
  .card-icon-btn{
    width:20px; height:20px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:0.62rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .card-icon-btn:hover{background:#F2F3F1; color:var(--ink);}
  .card-icon-btn.remove:hover{background:#9A3B2E; color:#fff; border-color:#9A3B2E;}

  .text-field{
    outline:none;
    font-size:0.92rem;
    line-height:1.55;
    color:var(--ink);
    min-height:1.55em;
  }
  .text-field:empty:before{content:attr(data-placeholder); color:#A7ADB3;}
  .text-field:focus{background:#FAFBFA; border-radius:6px; margin:-4px; padding:4px;}

  /* ---------- List rows ---------- */
  .list-row{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:9px 0;
    border-bottom:1px solid var(--line-soft);
    position:relative;
  }
  .list-row:last-of-type{border-bottom:none;}
  .list-row.single .list-main{flex:1;}
  .list-main{
    flex:1 1 55%;
    font-weight:500;
    font-size:0.88rem;
    outline:none;
    line-height:1.4;
  }
  .list-main:empty:before{content:attr(data-placeholder); color:#A7ADB3; font-weight:400;}
  .list-sub{
    flex:1 1 40%;
    font-size:0.82rem;
    color:var(--ink-soft);
    outline:none;
    line-height:1.4;
    text-align:right;
  }
  .list-sub:empty:before{content:attr(data-placeholder); color:#C2C7C4;}
  .list-main:focus, .list-sub:focus{background:#FAFBFA; border-radius:5px;}

  .row-delete{
    flex-shrink:0;
    width:18px; height:18px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:0.68rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0.35;
    transition:opacity .15s, background .15s, color .15s;
    margin-top:1px;
  }
  .list-row:hover .row-delete{opacity:1;}
  .row-delete:hover{background:#9A3B2E; color:#fff; border-color:#9A3B2E;}

  .add-row-btn{
    margin-top:10px;
    font-family:'Inter',sans-serif;
    font-size:0.8rem;
    font-weight:600;
    padding:7px 12px;
    border-radius:8px;
    border:1.5px dashed color-mix(in srgb, var(--accent) 55%, white);
    background:transparent;
    color:var(--accent);
    cursor:pointer;
    transition:background .15s;
  }
  .add-row-btn:hover{background:color-mix(in srgb, var(--accent) 8%, white);}

  /* ---------- Steps ---------- */
  .steps-list{display:flex; flex-direction:column; gap:0;}
  .step-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:9px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .step-row:last-of-type{border-bottom:none;}
  .step-badge{
    flex-shrink:0;
    width:24px; height:24px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    font-weight:500;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .step-text{
    flex:1;
    font-size:0.9rem;
    font-weight:500;
    outline:none;
    line-height:1.5;
    padding-top:2px;
  }
  .step-text:empty:before{content:attr(data-placeholder); color:#A7ADB3; font-weight:400;}
  .step-text:focus{background:#FAFBFA; border-radius:5px;}
  .step-controls{display:flex; gap:4px; flex-shrink:0; margin-top:1px;}
  .step-icon-btn{
    width:20px; height:20px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:0.62rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0.4;
    transition:opacity .15s, background .15s, color .15s;
  }
  .step-row:hover .step-icon-btn{opacity:1;}
  .step-icon-btn:hover{background:#F2F3F1; color:var(--ink);}
  .step-icon-btn.remove:hover{background:#9A3B2E; color:#fff; border-color:#9A3B2E;}

  /* ---------- Add-field row ---------- */
  .add-field-row{
    padding:16px 26px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    background:var(--paper);
  }
  .add-field-btn{
    font-family:'Inter',sans-serif;
    font-size:0.8rem;
    font-weight:600;
    padding:9px 14px;
    border-radius:9px;
    border:1.5px dashed #C3C9C4;
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .add-field-btn:hover{background:#F4F5F3; color:var(--ink); border-color:#9AA1A9;}

  footer{
    text-align:center;
    font-size:0.72rem;
    color:#9AA1A9;
    margin-top:18px;
  }

  /* ---------- Clean / screenshot view ---------- */
  body.clean-view .toolbar,
  body.clean-view .add-row-btn,
  body.clean-view .row-delete,
  body.clean-view .step-controls,
  body.clean-view .card-controls,
  body.clean-view .add-field-row{
    display:none !important;
  }
  body.clean-view [contenteditable]{cursor:default;}

  @media (max-width:760px){
    .grid{grid-template-columns:1fr;}
  }

  @media print{
    @page{ size: portrait; margin:12mm; }
    body{background:#fff; padding:0 !important; margin:0 !important;}
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    .toolbar, .add-row-btn, .row-delete, .step-controls, .card-controls, .add-field-row, .view-toggle{display:none !important;}
    .shell{max-width:none !important; width:100% !important; margin:0 !important;}
    #capture-target{box-shadow:none; border:1.5px solid var(--ink);}
    .card{break-inside:avoid;}
  }
</style>
</head>
<body>

<div class="shell">

  <button class="view-toggle" id="viewToggle" title="Bedienelemente ein-/ausblenden, z. B. zum Screenshotten">
    <span id="viewToggleIcon">🙈</span> <span id="viewToggleLabel">Optionen ausblenden</span>
  </button>

  <div class="toolbar">
    <button class="tbtn" id="btnPrint">🖨 Drucken</button>
    <button class="tbtn danger" id="btnReset">↺ Zurücksetzen</button>
  </div>

  <div id="capture-target">
    <div class="header">
      <div class="title-row">
        <svg class="badge-icon" width="34" height="34" viewBox="0 0 34 34" fill="none">
          <rect x="4" y="3" width="26" height="28" rx="3" stroke="#1B2432" stroke-width="1.3" opacity="0.55"/>
          <circle cx="17" cy="12" r="4" stroke="#1B2432" stroke-width="1.3" opacity="0.85"/>
          <path d="M9 25c1.5-4 5-6 8-6s6.5 2 8 6" stroke="#1B2432" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
        </svg>
        <div>
          <h1>Prozesssteckbrief</h1>
          <div id="processName" contenteditable="true" data-placeholder="Prozessname eingeben…"></div>
        </div>
      </div>

      <div class="meta-row" id="metaRow"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="add-field-row">
      <button class="add-field-btn" data-type="text">+ Freitext-Feld</button>
      <button class="add-field-btn" data-type="list2">+ Liste (2 Spalten)</button>
      <button class="add-field-btn" data-type="list1">+ Liste (einfach)</button>
      <button class="add-field-btn" data-type="steps">+ Schritte-Feld</button>
    </div>
  </div>

  <footer>Prozesssteckbrief-Vorlage — frei editierbar, lokal im Browser.</footer>
</div>

<script>
  function uid(){ return 'x' + Math.random().toString(36).slice(2,9); }
  function todayDE(){
    const d = new Date();
    return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
  }

  function defaultState(){
    return {
      processName: 'Kundenauftrag bearbeiten',
      meta: { id: 'KP-02', version: '1.0', date: todayDE(), owner: 'Vertriebsleitung' },
      sections: [
        {id: uid(), type:'text', title:'ZWECK & ZIEL', full:false,
          value:'Sicherstellen, dass Kundenaufträge vollständig, termingerecht und in der geforderten Qualität abgewickelt werden — von der Anfrage bis zur Auslieferung.',
          placeholder:'Wozu existiert dieser Prozess? Was soll erreicht werden?'},
        {id: uid(), type:'text', title:'GELTUNGSBEREICH', full:false,
          value:'Gilt für alle eingehenden Kundenaufträge im B2B-Vertrieb, unabhängig vom Bestellkanal (Telefon, E-Mail, Onlineshop).',
          placeholder:'Für welchen Bereich, welche Produkte oder Standorte gilt dieser Prozess?'},
        {id: uid(), type:'text', title:'PROZESSSTART (TRIGGER)', full:false,
          value:'Eingang einer Kundenanfrage oder -bestellung', placeholder:'Was löst den Prozess aus?'},
        {id: uid(), type:'text', title:'PROZESSENDE', full:false,
          value:'Rechnungsstellung und Zahlungseingang', placeholder:'Womit endet der Prozess?'},
        {id: uid(), type:'list2', title:'INPUT', full:false, mainPh:'Input benennen…', subPh:'Lieferant', addLabel:'+ Input hinzufügen',
          items:[{id:uid(), name:'Kundenanfrage', sub:'Kunde'}, {id:uid(), name:'Produktverfügbarkeit', sub:'Lager / ERP-System'}]},
        {id: uid(), type:'list2', title:'OUTPUT', full:false, mainPh:'Output benennen…', subPh:'Kunde', addLabel:'+ Output hinzufügen',
          items:[{id:uid(), name:'Auftragsbestätigung', sub:'Kunde'}, {id:uid(), name:'Lieferschein', sub:'Versand'}]},
        {id: uid(), type:'steps', title:'PROZESSSCHRITTE', full:true,
          items:[
            {id:uid(), text:'Anfrage erfassen und prüfen'},
            {id:uid(), text:'Angebot erstellen'},
            {id:uid(), text:'Auftrag anlegen'},
            {id:uid(), text:'Leistung erbringen / Ware kommissionieren'},
            {id:uid(), text:'Auslieferung veranlassen'},
            {id:uid(), text:'Rechnung stellen'}
          ]},
        {id: uid(), type:'list2', title:'ROLLEN & VERANTWORTLICHKEIT', full:false, mainPh:'Rolle…', subPh:'Verantwortlich für…', addLabel:'+ Rolle hinzufügen',
          items:[{id:uid(), name:'Vertrieb', sub:'Anfrage- und Auftragsklärung'}, {id:uid(), name:'Produktion / Lager', sub:'Leistungserbringung'}, {id:uid(), name:'Versand', sub:'Auslieferung'}]},
        {id: uid(), type:'list2', title:'KENNZAHLEN (KPIS)', full:false, mainPh:'Kennzahl…', subPh:'Zielwert…', addLabel:'+ Kennzahl hinzufügen',
          items:[{id:uid(), name:'Durchlaufzeit', sub:'≤ 5 Werktage'}, {id:uid(), name:'Liefertreue', sub:'≥ 95 %'}]},
        {id: uid(), type:'list1', title:'RESSOURCEN & SYSTEME', full:false, ph:'Ressource / System…', addLabel:'+ Ressource hinzufügen',
          items:[{id:uid(), text:'ERP-System'}, {id:uid(), text:'CRM'}, {id:uid(), text:'Lagerverwaltung'}]},
        {id: uid(), type:'list1', title:'SCHNITTSTELLEN', full:false, ph:'Schnittstelle zu…', addLabel:'+ Schnittstelle hinzufügen',
          items:[{id:uid(), text:'Einkauf (bei Beschaffung)'}, {id:uid(), text:'Finanzbuchhaltung (Rechnungsstellung)'}]},
        {id: uid(), type:'list1', title:'RISIKEN & KRITISCHE ERFOLGSFAKTOREN', full:true, ph:'Risiko oder Erfolgsfaktor…', addLabel:'+ Eintrag hinzufügen',
          items:[{id:uid(), text:'Lieferverzug durch Lieferantenengpässe'}, {id:uid(), text:'Fehlerhafte Bestandsdaten'}]}
      ]
    };
  }

  let state = defaultState();
  let focusRequest = null;

  const processNameEl = document.getElementById('processName');
  const metaRowEl = document.getElementById('metaRow');
  const gridEl = document.getElementById('grid');

  function bindEditable(el, onInput){
    el.addEventListener('input', () => onInput(el.textContent));
    el.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); el.blur(); }});
  }
  function bindMultiline(el, onInput){
    el.addEventListener('input', () => onInput(el.textContent));
  }

  function mkMetaField(label, key){
    const wrap = document.createElement('div');
    wrap.className = 'meta-field';
    const lab = document.createElement('div');
    lab.className = 'meta-label';
    lab.textContent = label;
    const val = document.createElement('div');
    val.className = 'meta-value';
    val.contentEditable = 'true';
    val.dataset.placeholder = '—';
    val.textContent = state.meta[key];
    bindEditable(val, v => state.meta[key] = v);
    wrap.append(lab, val);
    return wrap;
  }

  function mkCardHeader(section){
    const header = document.createElement('div');
    header.className = 'card-header';

    const ebWrap = document.createElement('div');
    ebWrap.className = 'card-eyebrow-wrap';
    const dot = document.createElement('span');
    dot.className = 'dot';
    const ebText = document.createElement('span');
    ebText.className = 'card-eyebrow-text';
    ebText.contentEditable = 'true';
    ebText.dataset.placeholder = 'Feldname…';
    ebText.textContent = section.title;
    bindEditable(ebText, v => section.title = v);
    ebWrap.append(dot, ebText);

    const controls = document.createElement('div');
    controls.className = 'card-controls';

    const widthBtn = document.createElement('button');
    widthBtn.className = 'card-icon-btn';
    widthBtn.textContent = section.full ? '⤡' : '⤢';
    widthBtn.title = section.full ? 'Halbe Breite' : 'Volle Breite';
    widthBtn.addEventListener('click', () => { section.full = !section.full; render(); });

    const delBtn = document.createElement('button');
    delBtn.className = 'card-icon-btn remove';
    delBtn.textContent = '×';
    delBtn.title = 'Feld löschen';
    delBtn.addEventListener('click', () => {
      if(confirm(`Feld "${section.title || 'Unbenannt'}" wirklich löschen?`)){
        state.sections = state.sections.filter(s => s.id !== section.id);
        render();
      }
    });

    controls.append(widthBtn, delBtn);
    header.append(ebWrap, controls);

    if(focusRequest && focusRequest.id === section.id){
      requestAnimationFrame(() => ebText.focus());
      focusRequest = null;
    }

    return header;
  }

  function mkTextCard(section){
    const card = document.createElement('div');
    card.className = 'card' + (section.full ? ' full' : '');
    card.appendChild(mkCardHeader(section));

    const field = document.createElement('div');
    field.className = 'text-field';
    field.contentEditable = 'true';
    field.dataset.placeholder = section.placeholder || 'Text eingeben…';
    field.textContent = section.value || '';
    bindMultiline(field, v => section.value = v);
    card.appendChild(field);
    return card;
  }

  function mkTwoFieldListCard(section){
    const card = document.createElement('div');
    card.className = 'card' + (section.full ? ' full' : '');
    card.appendChild(mkCardHeader(section));

    section.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'list-row';

      const main = document.createElement('div');
      main.className = 'list-main';
      main.contentEditable = 'true';
      main.dataset.placeholder = section.mainPh || 'Eintrag…';
      main.textContent = item.name;
      bindEditable(main, v => item.name = v);

      const sub = document.createElement('div');
      sub.className = 'list-sub';
      sub.contentEditable = 'true';
      sub.dataset.placeholder = section.subPh || '';
      sub.textContent = item.sub;
      bindEditable(sub, v => item.sub = v);

      const del = document.createElement('div');
      del.className = 'row-delete';
      del.textContent = '×';
      del.title = 'Eintrag löschen';
      del.addEventListener('click', () => {
        section.items = section.items.filter(i => i.id !== item.id);
        render();
      });

      row.append(main, sub, del);
      card.appendChild(row);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-row-btn';
    addBtn.textContent = section.addLabel || '+ Hinzufügen';
    addBtn.addEventListener('click', () => {
      section.items.push({id: uid(), name:'', sub:''});
      render();
    });
    card.appendChild(addBtn);
    return card;
  }

  function mkSingleFieldListCard(section){
    const card = document.createElement('div');
    card.className = 'card' + (section.full ? ' full' : '');
    card.appendChild(mkCardHeader(section));

    section.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'list-row single';

      const main = document.createElement('div');
      main.className = 'list-main';
      main.contentEditable = 'true';
      main.dataset.placeholder = section.ph || 'Eintrag…';
      main.textContent = item.text;
      bindEditable(main, v => item.text = v);

      const del = document.createElement('div');
      del.className = 'row-delete';
      del.textContent = '×';
      del.title = 'Eintrag löschen';
      del.addEventListener('click', () => {
        section.items = section.items.filter(i => i.id !== item.id);
        render();
      });

      row.append(main, del);
      card.appendChild(row);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-row-btn';
    addBtn.textContent = section.addLabel || '+ Hinzufügen';
    addBtn.addEventListener('click', () => {
      section.items.push({id: uid(), text:''});
      render();
    });
    card.appendChild(addBtn);
    return card;
  }

  function mkStepsCard(section){
    const card = document.createElement('div');
    card.className = 'card' + (section.full ? ' full' : '');
    card.appendChild(mkCardHeader(section));

    const list = document.createElement('div');
    list.className = 'steps-list';

    section.items.forEach((step, idx) => {
      const row = document.createElement('div');
      row.className = 'step-row';

      const badge = document.createElement('div');
      badge.className = 'step-badge';
      badge.textContent = String(idx+1).padStart(2,'0');

      const text = document.createElement('div');
      text.className = 'step-text';
      text.contentEditable = 'true';
      text.dataset.placeholder = 'Schritt beschreiben…';
      text.textContent = step.text;
      bindEditable(text, v => step.text = v);

      const controls = document.createElement('div');
      controls.className = 'step-controls';
      const up = document.createElement('button');
      up.className = 'step-icon-btn';
      up.textContent = '▲';
      up.title = 'Nach oben';
      up.addEventListener('click', () => {
        if(idx>0){ [section.items[idx-1], section.items[idx]] = [section.items[idx], section.items[idx-1]]; render(); }
      });
      const down = document.createElement('button');
      down.className = 'step-icon-btn';
      down.textContent = '▼';
      down.title = 'Nach unten';
      down.addEventListener('click', () => {
        if(idx<section.items.length-1){ [section.items[idx+1], section.items[idx]] = [section.items[idx], section.items[idx+1]]; render(); }
      });
      const del = document.createElement('button');
      del.className = 'step-icon-btn remove';
      del.textContent = '×';
      del.title = 'Schritt löschen';
      del.addEventListener('click', () => {
        section.items = section.items.filter(s => s.id !== step.id);
        render();
      });
      controls.append(up, down, del);

      row.append(badge, text, controls);
      list.appendChild(row);
    });

    card.appendChild(list);

    const addBtn = document.createElement('button');
    addBtn.className = 'add-row-btn';
    addBtn.textContent = '+ Schritt hinzufügen';
    addBtn.addEventListener('click', () => {
      section.items.push({id: uid(), text:''});
      render();
    });
    card.appendChild(addBtn);
    return card;
  }

  function renderSection(section){
    if(section.type === 'text') return mkTextCard(section);
    if(section.type === 'list2') return mkTwoFieldListCard(section);
    if(section.type === 'list1') return mkSingleFieldListCard(section);
    if(section.type === 'steps') return mkStepsCard(section);
    return document.createElement('div');
  }

  function render(){
    processNameEl.textContent = state.processName;

    metaRowEl.innerHTML = '';
    metaRowEl.appendChild(mkMetaField('Prozess-ID', 'id'));
    metaRowEl.appendChild(mkMetaField('Version', 'version'));
    metaRowEl.appendChild(mkMetaField('Datum', 'date'));
    metaRowEl.appendChild(mkMetaField('Prozessverantwortlicher', 'owner'));

    gridEl.innerHTML = '';
    state.sections.forEach(section => gridEl.appendChild(renderSection(section)));
  }

  bindEditable(processNameEl, v => state.processName = v);

  // ---------- Add new field ----------
  document.querySelectorAll('.add-field-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.type;
      let section;
      if(type === 'text'){
        section = {id: uid(), type:'text', title:'', full:false, value:'', placeholder:'Text eingeben…'};
      } else if(type === 'list2'){
        section = {id: uid(), type:'list2', title:'', full:false, mainPh:'Eintrag…', subPh:'Zusatzinfo…', addLabel:'+ Hinzufügen', items:[{id:uid(), name:'', sub:''}]};
      } else if(type === 'list1'){
        section = {id: uid(), type:'list1', title:'', full:false, ph:'Eintrag…', addLabel:'+ Hinzufügen', items:[{id:uid(), text:''}]};
      } else if(type === 'steps'){
        section = {id: uid(), type:'steps', title:'', full:true, items:[{id:uid(), text:''}]};
      }
      state.sections.push(section);
      focusRequest = {id: section.id};
      render();
    });
  });

  // ---------- View toggle ----------
  const viewToggle = document.getElementById('viewToggle');
  const viewToggleIcon = document.getElementById('viewToggleIcon');
  const viewToggleLabel = document.getElementById('viewToggleLabel');
  viewToggle.addEventListener('click', () => {
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const clean = document.body.classList.toggle('clean-view');
    viewToggleIcon.textContent = clean ? '👁' : '🙈';
    viewToggleLabel.textContent = clean ? 'Optionen einblenden' : 'Optionen ausblenden';
  });
  document.addEventListener('keydown', e => {
    if(e.key.toLowerCase() === 'v' && document.activeElement.getAttribute('contenteditable') !== 'true'){
      viewToggle.click();
    }
  });

  // ---------- Toolbar actions ----------
  document.getElementById('btnPrint').addEventListener('click', () => window.print());
  document.getElementById('btnReset').addEventListener('click', () => {
    if(confirm('Wirklich alle Inhalte zurücksetzen und die Standardvorlage laden?')){
      state = defaultState();
      render();
    }
  });

  render();
</script>

</body>
</html>
